<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACTIVITY3_LUCENA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Cormorant+SC:wght@500;600&family=Mrs+Saint+Delafield&family=Alex+Brush&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="images/favicon.png">
 <script src="script.js"></script>
</head>
<body>

  <main class="poster">

    <div class="grain"></div>
    <div class="vignette"></div>
    <div class="scrim"></div>

    <header class="poster__eyebrow">
      <p class="tagline">Some stories aren't written.<br>They're lived.</p>
    </header>

    <section class="portrait" id="portrait" aria-label="Hover or press to reveal the other side of the story">
      <div class="portrait__glow"></div>
      <img class="portrait__img portrait__img--smile" src="images/smile.jpg" alt="Shaina smiling, waving at the camera">
      <img class="portrait__img portrait__img--hide" src="images/hide.jpg" alt="Shaina covering her face">
      <div class="particles" id="particles"></div>
    </section>

    <section class="poster__body">
      <p class="script">The silence<br>behind her eyes</p>
      <div class="heart" aria-hidden="true">♡</div>

      <p class="subline">Not a perfect story. Just a real one.</p>

      <h1 class="title">Coming Soon</h1>
      <p class="release">Only in life.</p>
      <div class="rule"><span>♡</span></div>
    </section>

    <footer class="poster__footer">
      <p class="signature">— shaina <span aria-hidden="true">♡</span></p>
    </footer>

  </main>

  <script src="script.js"></script>
</body>
</html>
